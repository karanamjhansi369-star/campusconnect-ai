<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusConnect AI – Smart Campus Assistant</title>
    <meta name="description" content="A modern, unified smart campus portal for college students to discover campus events, academic resources, student clubs, and essential campus information." />
    <meta property="og:title" content="CampusConnect AI – Smart Campus Assistant" />
    <meta property="og:description" content="A modern, unified smart campus portal for college students to discover campus events, academic resources, student clubs, and essential campus information." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- n8n Chat Widget CSS -->
    <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
    <style>
      :root {
        --chat--color-primary: #4f46e5;
        --chat--color-primary-shade-50: #4338ca;
        --chat--color-primary-shade-100: #3730a3;
        --chat--color-secondary: #0f172a;
        --chat--color-light: #ffffff;
        --chat--color-dark: #0b132b;
        --chat--window--width: 400px;
        --chat--window--height: 600px;
        --chat--header--background: #0b132b;
        --chat--header--color: #ffffff;
        --chat--toggle--background: #4f46e5;
        --chat--toggle--hover--background: #4338ca;
        --chat--toggle--color: #ffffff;
        --chat--message--bot--background: #1e293b;
        --chat--message--bot--color: #f8fafc;
        --chat--message--user--background: #4f46e5;
        --chat--message--user--color: #ffffff;
      }
      .chat-window {
        z-index: 9999 !important;
        border-radius: 1.25rem !important;
        overflow: hidden !important;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5) !important;
        border: 1px solid rgba(99, 102, 241, 0.25) !important;
      }
      .chat-window-toggle {
        z-index: 9998 !important;
        box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.5) !important;
        transition: transform 0.2s ease !important;
      }
      .chat-window-toggle:hover {
        transform: scale(1.06) !important;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-indigo-500/20 selection:text-indigo-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
